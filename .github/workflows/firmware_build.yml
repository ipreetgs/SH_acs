name: Firmware Build Pipeline\n\non: \n  push:\n    branches: [main]\n  pull_request:\n    branches: [main]\n\njobs:\n  build-firmware:\n    runs-on: ubuntu-latest\n    container: espressif/idf:release-v5.1\n    steps:\n      - uses: actions/checkout@v3\n        with:\n          submodules: 'recursive'\n\n      - name: Install ESP-Matter Pre-requisites\n        run: |\n          apt-get update\n          apt-get install -y git wget libgirepository1.0-dev libcairo2-dev pkg-config python3-dev python3-pip python3-venv\n\n      - name: Build Firmware\n        working-directory: ./firmware\n        run: |\n          idf.py build\n\n      - name: Upload Artifact\n        uses: actions/upload-artifact@v3\n        with:\n          name: esp32s3-matter-firmware\n          path: ./firmware/build/rgb_smart_bulb.bin\n
